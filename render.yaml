# Render Blueprint (free tier): deploy the FastAPI backend.
#
# Uses repo root (no rootDir) so installs always use backend/requirements.txt.
# That avoids "uvicorn: command not found" when the dashboard Root Directory is left blank
# (which would install only the repo-root requirements.txt — no uvicorn).
#
# Manual setup equivalent:
#   Root Directory: (empty) or repo root
#   Build:  pip install -r backend/requirements.txt
#   Start:  python -m uvicorn render_api:app --host 0.0.0.0 --port $PORT
#   Do NOT use `uvicorn main:app` from repo root — that loads CLI main.py, not the API.
#
# Env vars:
#   CORS_ORIGINS=https://your-app.vercel.app
#   SIGNALS_LOG_DIR=/opt/render/project/src/logs   (optional, if you sync logs into the repo)

services:
  - type: web
    name: nifty-signals-api
    runtime: python
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: python -m uvicorn render_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
